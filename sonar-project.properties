sonar.projectKey=transmetro
sonar.projectName=Transmetro
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,backend/test,frontend/src,frontend/test,frontend/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.cpd.exclusions=backend/src/migrations/**,backend/src/seeds/datos/**
sonar.coverage.exclusions=\
  backend/src/main.ts,\
  backend/src/openapi.ts,\
  **/*.module.ts,\
  backend/src/migrations/**,\
  backend/src/seeds/**,\
  **/*.entity.ts,\
  backend/src/shared/config/**,\
  frontend/src/config/**,\
  frontend/src/modules/*/index.ts,\
  frontend/src/app/**,\
  frontend/src/instrumentation.ts
